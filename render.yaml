services:
  # Web Service for the Flask App
  - type: web
    name: research-site-web
    env: python
    plan: free
    region: frankfurt
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "gunicorn src.main:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: research-db
          property: connectionString
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS_HASH
        value: "pbkdf2:sha256:600000$zQ8yV4xG7nL9wK3f$1a9f8b7c6d5e4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b"
      - key: S3_ENDPOINT_URL
        value: "https://your-accountid.r2.cloudflarestorage.com"
      - key: S3_ACCESS_KEY_ID
        sync: false  # Set securely in Render dashboard
      - key: S3_SECRET_ACCESS_KEY
        sync: false  # Set securely in Render dashboard
      - key: S3_BUCKET_NAME
        value: "your-r2-bucket-name"

  # PostgreSQL Database Service
  - type: postgresSQL
    name: research-db
    plan: free
    region: frankfurt
    ipAllowList: []
    # version: "14"  # Optional: specify PostgreSQL version
